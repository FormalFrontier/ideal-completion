# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "ideal-completion"
  description: >-
    Ideal completions of bounded distributive lattices: the injective principal
    bounded lattice homomorphism, finite-join witnesses for arbitrary suprema,
    frame structure, compact-principal characterization and compact generation,
    and a prime-order-ideal/Boolean-map equivalence for bounded lattices.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Ideal completion of a bounded distributive lattice"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Classical order theory, proved here with mathlib's native order ideals.
      No novelty of the mathematical results or human/source-author endorsement
      is claimed.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - "Kazuhiro Fujiwara"
      - "Fumiharu Kato"
    id: "https://arxiv.org/abs/1308.4734v5"
    type: "book"
    location: "Chapter 0, section 2.2(b), paragraph after Definition 2.2.6, printed page 38"
    relationship: "background"
    note: >-
      Motivating description of the ideal completion, principal embedding and
      finite (order-theoretically compact) elements. Detailed source-coverage
      decisions are maintained separately, not asserted by this metadata.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Uses Order.Ideal, BoundedLatticeHom, Order.Frame and compact-element
      infrastructure at the revision pinned by the Lake manifest.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier AI agents using Lean, Lake and Git for formalization,
        documentation and maintenance, with separate independent agent review.
  notes: >-
    The mathematical core and reference adapter/assembly were prepared by the
    Anchor AI agent; another AI contributor prepared module/example readiness.
    Independent agent reviewers examined the earlier work. No human peer review
    or source-author endorsement is implied; model versions and costs are not
    inferred from service identities.

status:
  scope: >-
    For DistribLattice A and BoundedOrder A, reusable ideal completion with an
    injective principal bounded lattice homomorphism, finite-join witnesses for
    arbitrary suprema, frame structure, compact iff principal and compact
    generation. For Lattice A and BoundedOrder A, prime order ideals correspond
    to Boolean-valued bounded lattice homomorphisms. Does not include
    prime-ideal existence, spectra, Stone duality,
    universal extension or generic partial-order completion, and does not claim
    whole-source formalization.

review:
  status: "other: historical revision-specific independent agent assessments"
  notes: >-
    Independent agent reviewers assessed the mathematical core and later
    module/example readiness, including API, proof evidence, semantics,
    provenance and rights. Those assessments apply only to their reviewed
    revisions, not automatically to later documentation, public history,
    publication or source coverage. Each release requires applicable checks,
    affected independent review and a separate maintainer decision.

acknowledgements: >-
  Lean and mathlib authors for the proof assistant, tactics and native
  mathematical infrastructure; Formal Frontier's source-maintainer team for
  development, review and integration.
